name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

# A new push stops the run for the commit it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every job starts at once. The setup step works out from the changed files
# whether the job has anything to do, and the steps after it only run if so.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - id: setup
        uses: ./.github/actions/setup
      - name: Ranking updater tests
        run: python3 -B scripts/test-update-ranking.py
      - if: steps.setup.outputs.run == 'true'
        name: Publication workflow tests
        run: node --test scripts/test-publish-workflow.mjs scripts/test-ci.mjs
      - if: steps.setup.outputs.run == 'true'
        run: npm run check
      - if: steps.setup.outputs.run == 'true'
        run: npm run lint
      - if: steps.setup.outputs.run == 'true'
        run: npm audit --omit=dev

  # The unit, integration and end-to-end suite, in four parts.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@v5
      - id: setup
        uses: ./.github/actions/setup
      - if: steps.setup.outputs.run == 'true'
        name: Tests (part ${{ matrix.shard }})
        env:
          PI_GOAL_CI_LOG_DIR: ${{ runner.temp }}/pi-goal-validation
        run: node scripts/ci-checks.mjs --only tests --shard ${{ matrix.shard }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ strategy.job-index }}
          path: ${{ runner.temp }}/pi-goal-validation/
          retention-days: 5
          if-no-files-found: ignore

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - id: setup
        uses: ./.github/actions/setup
      - if: steps.setup.outputs.run == 'true'
        name: Installed package, context and cache regressions
        env:
          PI_GOAL_CI_LOG_DIR: ${{ runner.temp }}/pi-goal-validation
        run: node scripts/ci-checks.mjs --skip tests --skip controls-cli
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/pi-goal-validation/
          retention-days: 5
          if-no-files-found: ignore

  # The walkthrough cases are independent, so they run in five groups.
  # scripts/test-ci.mjs checks that every case is in exactly one group.
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cases:
          - controls-run settings-keys foreign-focus
          - together editor-controls command-shortcuts
          - goal-first goal-first-finish
          - native-interrupt dialog-keys answer-editing
          - controls-ui settings-paths
    steps:
      - uses: actions/checkout@v5
      - id: setup
        uses: ./.github/actions/setup
        with:
          need: controls
      - if: steps.setup.outputs.run == 'true'
        name: Controls walkthrough in the Pi CLI
        run: node experiments/controls/cli-walkthrough.mjs ${{ matrix.cases }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: controls-${{ strategy.job-index }}
          path: experiments/runs/goal-controls/
          retention-days: 5
          if-no-files-found: ignore

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - id: setup
        uses: ./.github/actions/setup
        with:
          need: bench
      - if: steps.setup.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CI_BASE_SHA }}
          path: .benchmark-base
      - if: steps.setup.outputs.run == 'true'
        name: Runtime benchmark regression gate
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" .benchmark-base/node_modules
          # Main preserves compact historical checkpoints; use the corrected fixture for both runs.
          cp experiments/bench/b10-checkpoint-growth.mjs .benchmark-base/experiments/bench/b10-checkpoint-growth.mjs
          # Both runs use their own directory, and the runner has cores to spare.
          npm --prefix .benchmark-base run bench:naf -- after naf &
          base=$!
          npm run bench:naf -- after naf
          wait "$base"
          PI_GOAL_BENCH_REFERENCE="$GITHUB_WORKSPACE/.benchmark-base/experiments/bench/baseline-naf-after.json" npm run bench:gate:naf

  # The one check branch protection needs. It starts with the others and watches them, so it
  # finishes a moment after the last one instead of waiting for a new runner to start.
  # It passes when every other job passed or had nothing to do.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
    steps:
      - name: Wait for the other jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100"
          while true; do
            jobs=$(gh api "$url" --jq '[.jobs[] | select(.name != "validate")]')
            bad=$(jq -r '[.[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped") | .name] | join(", ")' <<<"$jobs")
            if [ -n "$bad" ]; then echo "Failed: $bad"; exit 1; fi
            open=$(jq '[.[] | select(.status != "completed")] | length' <<<"$jobs")
            total=$(jq 'length' <<<"$jobs")
            if [ "$total" -gt 0 ] && [ "$open" -eq 0 ]; then echo "All $total jobs passed or had nothing to do."; exit 0; fi
            sleep 2
          done
